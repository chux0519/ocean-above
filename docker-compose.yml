# Ocean Above: web + api + proxy (Caddy). Only `proxy` publishes a port, on loopback.
# Before the first `up`: copy locations.db into ./locations (see README "Run locally").

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *logging
    environment:
      API_ORIGIN: http://api:8000
    expose:
      - "3000"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: ./.env
        required: false
    environment:
      LOCATIONS_DB: /srv/locations/locations.db
    volumes:
      # Application database (written by the API). Survives rebuilds; never overwritten by a deploy.
      - ./data:/app/data
      # Directory, not a single file: a replaced locations.db must be visible in the container (fingerprint reload).
      - ${LOCATIONS_DIR:-./locations}:/srv/locations:ro
    expose:
      - "8000"

  # Optional local tracing UI (#35): only with `docker compose --profile tracing up`; never started by a
  # plain `up`. Phoenix receives OTLP/HTTP on 6006 inside the compose network; its UI is published on
  # loopback only (http://localhost:6006, no auth). Traces stay on this host, in the `phoenix` volume.
  # The api exports only when OTEL_TRACING_ENABLED=1 and OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006
  # are set in .env (see README "Tracing").
  phoenix:
    image: arizephoenix/phoenix:version-22.0.1
    profiles: ["tracing"]
    restart: unless-stopped
    logging: *logging
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"  # no usage statistics from Phoenix itself (review P2-9)
    volumes:
      - phoenix:/mnt/data
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
      - api
    ports:
      - "127.0.0.1:${OCEAN_PORT:-3000}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs/talk:/srv/talk:ro  # talk slides at /talk/ (see Caddyfile)

volumes:
  phoenix:
