[project]
name = "ocean-above-backend"
version = "0.1.0"
description = "Ocean Above booking assistant - backend (deterministic core + API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = [
    "slow: exhaustive cross-checks (still part of the default run)",
]
